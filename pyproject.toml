[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem0-alpha"
version = "0.1.0"
description = "Mem0α — provider-agnostic long-term memory for LLM agents; reuses your Claude Code CLI session or any API key"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "llm-mem0 contributors" }]
keywords = ["llm", "memory", "mem0", "rag", "agents", "anthropic", "openai", "chromadb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mem0ai>=0.1.0",
    "chromadb>=0.5",
    "aiohttp>=3.9",
    "requests>=2.31",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.30"]
# Japanese morphological tokenization for the BM25 index (optional; the index
# falls back gracefully when absent).
japanese = ["janome>=0.5"]
# MCP server wrapper (`mem0-alpha-mcp` command) — see README "MCP server".
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mem0-alpha-mcp = "llm_mem0.mcp_server:main"

[project.urls]
Homepage = "https://github.com/haroin57/Mem0-alpha"
Repository = "https://github.com/haroin57/Mem0-alpha"

[tool.setuptools.packages.find]
include = ["llm_mem0*"]

[tool.setuptools.package-data]
llm_mem0 = ["py.typed"]
